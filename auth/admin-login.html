<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Portal — NovaStudios</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nova: {
                            bg: '#111113',
                            surface: '#18181B',
                            obsidian: '#0A0A0C',
                            crimson: '#E5194B',
                            berry: '#D11D53',
                            gold: '#F5A623',
                            glow: '#F8D568',
                            muted: '#8E8E93'
                        }
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #111113;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .admin-card {
            background: rgba(24, 24, 27, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.95);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 selection:bg-nova-crimson selection:text-white">

    <div class="w-full max-w-md admin-card rounded-3xl p-8 space-y-6 relative border border-white/10 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-nova-crimson to-nova-berry mx-auto flex items-center justify-center shadow-lg shadow-nova-crimson/30">
                <i data-lucide="shield-alert" class="w-7 h-7 text-white"></i>
            </div>
            <h1 class="text-2xl font-extrabold font-display text-white">Nova<span class="text-nova-crimson">Admin</span></h1>
            <p class="text-xs text-nova-muted">Enter administrative credentials to access operations</p>
        </div>

        <!-- Form -->
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-nova-muted mb-1.5">Admin Email</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 text-nova-muted absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input
                        id="adminEmail"
                        type="email"
                        required
                        value="admin@novastudios.com"
                        class="w-full bg-nova-obsidian border border-white/10 focus:border-nova-crimson rounded-xl pl-10 pr-4 py-2.5 text-xs text-white outline-none transition-all"
                    />
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-nova-muted mb-1.5">Security Key / Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-nova-muted absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input
                        id="adminPassword"
                        type="password"
                        required
                        value="••••••••••••"
                        class="w-full bg-nova-obsidian border border-white/10 focus:border-nova-crimson rounded-xl pl-10 pr-4 py-2.5 text-xs text-white outline-none transition-all"
                    />
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-nova-muted pt-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked class="w-4 h-4 accent-nova-crimson rounded" />
                    <span>Remember terminal</span>
                </label>
                <span class="text-emerald-400 font-mono text-[10px]">2FA ACTIVE</span>
            </div>

            <button
                type="submit"
                id="submitBtn"
                class="w-full py-3 rounded-xl bg-gradient-to-r from-nova-crimson to-nova-berry text-white text-xs sm:text-sm font-bold shadow-lg shadow-nova-crimson/30 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2"
            >
                <i data-lucide="key" class="w-4 h-4"></i>
                <span>Authenticate & Access Dashboard</span>
            </button>
        </form>

        <div class="pt-2 text-center">
            <a href="../dashboard/index.html" class="text-xs text-nova-muted hover:text-white transition-colors">
                ← Return to User Dashboard
            </a>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toastBanner" class="fixed top-6 z-50 hidden items-center gap-2 px-4 py-2.5 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 text-xs font-semibold shadow-2xl">
        <i data-lucide="check-circle" class="w-4 h-4"></i>
        <span id="toastMessage">Authorized. Opening Admin Console...</span>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
        });

        function handleAdminLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerHTML = `<span>Authorizing Admin Credentials...</span>`;

            const toast = document.getElementById("toastBanner");
            toast.classList.remove("hidden");
            toast.classList.add("flex");

            setTimeout(() => {
                window.location.href = "../admin/index.html";
            }, 800);
        }
    </script>
</body>
</html>
