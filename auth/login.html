<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sign In — NovaStudios</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nova: {
                            bg: '#111113',
                            surface: '#18181B',
                            obsidian: '#0A0A0C',
                            crimson: '#E5194B',
                            berry: '#D11D53',
                            gold: '#F5A623',
                            glow: '#F8D568',
                            muted: '#8E8E93',
                            steel: '#1E2B3C',
                            taupe: '#B59E88'
                        }
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS3 -->
    <style>
        body {
            background-color: #111113;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        h1,
        h2,
        h3,
        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #0A0A0C;
        }

        ::-webkit-scrollbar-thumb {
            background: #27272A;
            border-radius: 9999px;
        }

        /* Fullscreen Background Image Matching Registration */
        .app-bg-scene {
            background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=85');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Native Mobile App Bottom-Sheet / Card Glassmorphism */
        .mobile-app-sheet {
            background: rgba(24, 24, 27, 0.90);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.95);
        }

        /* Native App Input Field */
        .app-input {
            background: rgba(17, 17, 19, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-input:focus {
            background: #111113;
            border-color: #E5194B;
            box-shadow: 0 0 0 4px rgba(229, 25, 75, 0.14);
        }

        /* Shake Animation on Invalid Submit */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-5px);
            }

            40%,
            80% {
                transform: translateX(5px);
            }
        }

        .animate-shake {
            animation: shake 0.35s ease-in-out;
        }

        /* Dark Autofill Fix */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #FFFFFF;
            -webkit-box-shadow: 0 0 0px 1000px #111113 inset;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>

<body
    class="app-bg-scene min-h-screen flex flex-col justify-between relative selection:bg-nova-crimson selection:text-white">

    <!-- Cinematic Dark Vignette Over Background Image -->
    <div
        class="fixed inset-0 bg-gradient-to-b from-nova-obsidian/75 via-nova-bg/85 to-nova-obsidian/95 pointer-events-none z-0">
    </div>
    <div
        class="fixed inset-0 bg-[radial-gradient(circle_at_top,rgba(229,25,75,0.22),transparent_60%)] pointer-events-none z-0">
    </div>

    <!-- ==================== TOP APP NAVIGATION BAR ==================== -->
    <header class="relative z-20 w-full max-w-md mx-auto px-5 pt-5 pb-2 flex items-center justify-between">
        <a href="../index.html" aria-label="Back to Home"
            class="w-10 h-10 rounded-full bg-nova-surface/80 hover:bg-nova-surface border border-white/10 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-all">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </a>

        <!-- Centered App Brand Pill -->
        <div
            class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-nova-obsidian/70 border border-white/10 backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-nova-crimson animate-pulse"></span>
            <span class="font-display font-extrabold text-sm tracking-tight text-white">
                Nova<span class="text-nova-crimson">Studios</span>
            </span>
        </div>

        <a href="register.html"
            class="text-xs font-bold text-white/90 hover:text-nova-crimson px-3 py-2 rounded-full bg-nova-surface/70 border border-white/10 backdrop-blur-md transition-colors">
            Sign Up
        </a>
    </header>

    <!-- ==================== APP HERO HEADER (SHOWING BACKGROUND ARTWORK) ==================== -->
    <div class="relative z-10 w-full max-w-md mx-auto px-6 pt-6 pb-8 text-center">
        <div
            class="w-14 h-14 mx-auto mb-3.5 rounded-2xl bg-gradient-to-br from-nova-crimson to-nova-berry flex items-center justify-center shadow-xl shadow-nova-crimson/35 border border-white/15">
            <i data-lucide="sparkles" class="w-7 h-7 text-white"></i>
        </div>
        <h1 class="font-display font-black text-2xl sm:text-3xl text-white tracking-tight">
            Welcome Back
        </h1>
        <p class="text-xs sm:text-sm text-gray-300/80 mt-1">
            Pick up right where you left off in your library
        </p>
    </div>

    <!-- ==================== MOBILE APP BOTTOM-SHEET CARD ==================== -->
    <main class="relative z-20 w-full max-w-md mx-auto mt-auto sm:my-auto px-0 sm:px-4">
        <div class="mobile-app-sheet rounded-t-[32px] sm:rounded-[32px] px-6 pt-4 pb-9 sm:p-8">

            <!-- Native Mobile Sheet Drag Handle -->
            <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-6 sm:hidden"></div>

            <!-- Continue with Google (Native App Style Button) -->
            <button type="button" id="googleSignInBtn" onclick="handleGoogleSignIn()"
                class="w-full h-12 px-4 rounded-2xl bg-white hover:bg-gray-100 active:scale-[0.98] text-nova-obsidian font-bold text-sm flex items-center justify-center gap-3 shadow-lg transition-all">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4"
                        d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z" />
                    <path fill="#34A853"
                        d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z" />
                    <path fill="#FBBC05"
                        d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z" />
                    <path fill="#EA4335"
                        d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z" />
                </svg>
                <span>Continue with Google</span>
            </button>

            <!-- Clean App Divider -->
            <div class="relative my-5 flex items-center justify-center">
                <div class="border-t border-white/10 w-full"></div>
                <span class="px-3 text-[11px] font-semibold uppercase tracking-widest text-nova-muted shrink-0">
                    or
                </span>
                <div class="border-t border-white/10 w-full"></div>
            </div>

            <!-- Validated Login Form -->
            <form id="loginForm" novalidate class="space-y-4">

                <!-- Email Address -->
                <div>
                    <label for="email"
                        class="block text-[11px] font-semibold uppercase tracking-wider text-nova-muted mb-1.5 ml-1">Email
                        Address</label>
                    <div class="relative">
                        <i data-lucide="mail"
                            class="w-4 h-4 text-nova-muted absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com"
                            class="app-input w-full h-12 pl-10 pr-9 rounded-2xl text-white text-sm placeholder:text-nova-muted/45 focus:outline-none" />
                        <i data-lucide="check-circle-2" id="valid-email"
                            class="hidden w-4 h-4 text-emerald-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    </div>
                    <p id="error-email" class="hidden text-[11px] text-nova-crimson font-medium mt-1 ml-1"></p>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-1.5 px-1">
                        <label for="password"
                            class="block text-[11px] font-semibold uppercase tracking-wider text-nova-muted">Password</label>
                        <button type="button" onclick="openForgotModal()"
                            class="text-[11px] font-bold text-nova-crimson hover:text-nova-glow transition-colors">
                            Forgot Password?
                        </button>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock"
                            class="w-4 h-4 text-nova-muted absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="password" id="password" name="password" autocomplete="current-password"
                            placeholder="Enter password"
                            class="app-input w-full h-12 pl-10 pr-11 rounded-2xl text-white text-sm placeholder:text-nova-muted/45 focus:outline-none" />
                        <button type="button" onclick="togglePasswordVisibility()"
                            aria-label="Toggle Password Visibility"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-nova-muted hover:text-white transition-colors">
                            <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p id="error-password" class="hidden text-[11px] text-nova-crimson font-medium mt-1 ml-1"></p>
                </div>

                <!-- Remember Me Switch -->
                <div class="flex items-center justify-between pt-0.5 px-1">
                    <label class="flex items-center gap-2.5 cursor-pointer select-none">
                        <input type="checkbox" id="rememberMe" checked
                            class="w-4 h-4 rounded-md border-white/20 bg-nova-bg text-nova-crimson focus:ring-nova-crimson focus:ring-offset-0 accent-[#E5194B]" />
                        <span class="text-xs text-nova-muted">Keep me signed in</span>
                    </label>
                </div>

                <!-- Full-Width Native App Primary Button -->
                <button type="submit" id="submitBtn"
                    class="w-full h-12 sm:h-13 rounded-2xl bg-gradient-to-r from-nova-crimson to-nova-berry hover:opacity-95 active:scale-[0.98] text-white font-bold text-sm sm:text-base shadow-xl shadow-nova-crimson/35 transition-all flex items-center justify-center gap-2 mt-3">
                    <span>Sign In</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Bottom Register Prompt -->
            <p class="text-center text-xs text-nova-muted mt-6">
                New to NovaStudios?
                <a href="register.html" class="font-bold text-white hover:text-nova-crimson transition-colors ml-1">
                    Create Account
                </a>
            </p>

        </div>
    </main>

    <!-- ==================== FORGOT PASSWORD BOTTOM SHEET MODAL ==================== -->
    <div id="forgotModal"
        class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="mobile-app-sheet w-full max-w-md rounded-t-[32px] sm:rounded-[32px] p-6 sm:p-8 relative">
            <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-5 sm:hidden"></div>

            <button onclick="closeForgotModal()" aria-label="Close Modal"
                class="absolute top-5 right-5 w-9 h-9 rounded-full bg-nova-bg text-nova-muted hover:text-white flex items-center justify-center transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <div
                class="w-11 h-11 rounded-2xl bg-nova-crimson/15 border border-nova-crimson/30 flex items-center justify-center text-nova-crimson mb-4">
                <i data-lucide="key-round" class="w-5 h-5"></i>
            </div>

            <h3 class="font-display font-bold text-xl text-white">Reset Password</h3>
            <p class="text-xs text-nova-muted mt-1 mb-5 leading-relaxed">
                Enter your NovaStudios email address and we'll send you a secure reset link.
            </p>

            <form id="forgotForm" novalidate class="space-y-4">
                <div>
                    <label for="resetEmail"
                        class="block text-[11px] font-semibold uppercase tracking-wider text-nova-muted mb-1.5 ml-1">Email
                        Address</label>
                    <input type="email" id="resetEmail" placeholder="you@example.com"
                        class="app-input w-full h-12 px-4 rounded-2xl text-white text-sm placeholder:text-nova-muted/45 focus:outline-none" />
                    <p id="error-resetEmail" class="hidden text-[11px] text-nova-crimson font-medium mt-1 ml-1"></p>
                </div>
                <button type="submit"
                    class="w-full h-12 rounded-2xl bg-nova-crimson hover:bg-nova-berry text-white font-bold text-sm shadow-lg shadow-nova-crimson/30 transition-all">
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>

    <!-- Floating App Toast Banner -->
    <div id="toastBanner"
        class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden items-center gap-2.5 px-4 py-3 rounded-2xl bg-nova-obsidian/95 border border-nova-crimson/60 text-white text-xs sm:text-sm font-semibold shadow-2xl backdrop-blur-md whitespace-nowrap">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-nova-gold shrink-0"></i>
        <span id="toastMessage">Signed in!</span>
    </div>

    <!-- ==================== VALIDATION & APP INTERACTION SCRIPT ==================== -->
    <script>
        lucide.createIcons();

        const loginForm = document.getElementById('loginForm');
        const fields = {
            email: document.getElementById('email'),
            password: document.getElementById('password')
        };

        const validators = {
            email: (val) => {
                const trimmed = val.trim();
                if (!trimmed) return 'Email address is required.';
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(trimmed)) return 'Enter a valid email address.';
                return '';
            },
            password: (val) => {
                if (!val) return 'Password is required.';
                if (val.length < 6) return 'Password must be at least 6 characters.';
                return '';
            }
        };

        function validateField(fieldName) {
            const input = fields[fieldName];
            const errorEl = document.getElementById(`error-${fieldName}`);
            const validIcon = document.getElementById(`valid-${fieldName}`);
            const errorMsg = validators[fieldName](input.value);

            if (errorMsg) {
                errorEl.textContent = errorMsg;
                errorEl.classList.remove('hidden');
                if (validIcon) validIcon.classList.add('hidden');
                input.style.borderColor = '#E5194B';
                return false;
            } else {
                errorEl.classList.add('hidden');
                if (validIcon) validIcon.classList.remove('hidden');
                input.style.borderColor = 'rgba(52, 211, 153, 0.55)';
                return true;
            }
        }

        Object.keys(fields).forEach((key) => {
            const el = fields[key];
            el.addEventListener('blur', () => validateField(key));
            el.addEventListener('input', () => {
                const errorVisible = !document.getElementById(`error-${key}`).classList.contains('hidden');
                if (errorVisible || el.value.length > 0) {
                    validateField(key);
                }
            });
        });

        function togglePasswordVisibility() {
            const passwordInput = fields.password;
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            let allValid = true;
            let firstInvalidField = null;

            Object.keys(fields).forEach((key) => {
                const isValid = validateField(key);
                if (!isValid) {
                    allValid = false;
                    if (!firstInvalidField) firstInvalidField = fields[key];
                }
            });

            if (!allValid) {
                loginForm.classList.remove('animate-shake');
                void loginForm.offsetWidth;
                loginForm.classList.add('animate-shake');
                if (firstInvalidField) firstInvalidField.focus();
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span>Signing In...</span>
      `;

            setTimeout(() => {
                showToast('Welcome back! Opening your library...');
                setTimeout(() => {
                    window.location.href = '../dashboard/index.html';
                }, 1100);
            }, 850);
        });

        function handleGoogleSignIn() {
            const btn = document.getElementById('googleSignInBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="text-sm font-bold text-nova-obsidian">Authenticating with Google...</span>`;

            setTimeout(() => {
                showToast('Signed in with Google! Entering NovaStudios...');
                setTimeout(() => {
                    window.location.href = '../dashboard/index.html';
                }, 1100);
            }, 850);
        }

        // Forgot Password Modal & Validation
        const forgotModal = document.getElementById('forgotModal');
        const forgotForm = document.getElementById('forgotForm');
        const resetEmailInput = document.getElementById('resetEmail');
        const resetEmailError = document.getElementById('error-resetEmail');

        function openForgotModal() {
            forgotModal.classList.remove('hidden');
            forgotModal.classList.add('flex');
            resetEmailError.classList.add('hidden');
            resetEmailInput.style.borderColor = '';
        }

        function closeForgotModal() {
            forgotModal.classList.add('hidden');
            forgotModal.classList.remove('flex');
        }

        forgotForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = resetEmailInput.value.trim();
            if (!val || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)) {
                resetEmailError.textContent = 'Enter a valid email address.';
                resetEmailError.classList.remove('hidden');
                resetEmailInput.style.borderColor = '#E5194B';
                return;
            }
            closeForgotModal();
            showToast(`Reset link sent to ${val}`);
        });

        forgotModal.addEventListener('click', (e) => {
            if (e.target === forgotModal) closeForgotModal();
        });

        function showToast(msg) {
            const toast = document.getElementById('toastBanner');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 3600);
        }
    </script>
</body>

</html>
